<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CashFlow AI — Offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#faf8f2;color:#202923;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  .card{max-width:340px}
  .mark{width:72px;height:72px;margin:0 auto 20px;border-radius:22px;background:#123c32;
        color:#fff;font-size:38px;font-weight:800;display:flex;align-items:center;justify-content:center}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#748078;font-size:14px;line-height:1.6;margin:0 0 24px}
  button{background:#123c32;color:#fff;border:0;border-radius:12px;padding:13px 26px;
         font-size:15px;font-weight:700;cursor:pointer}
  button:active{opacity:.85}
</style>
</head>
<body>
<div class="card">
  <div class="mark">₦</div>
  <h1>You're offline</h1>
  <p>CashFlow AI needs an internet connection to load your records and the AI coach. Check your connection and try again.</p>
  <button onclick="window.location.href='https://cashflow-zmmf.onrender.com/'">Try again</button>
</div>
</body>
</html>
